    <link rel="stylesheet" href="../styles.css" />

    <link

      rel="stylesheet"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />

all.min.css"
    />

  <body>
    <header>
      <a href="../index.html">
        <img
          id="logo"
          src="../imagenes/logo.png"
          alt="Logo del sitio, imagen de carbohidratos"
      /></a>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="./carrito.html">Carrito</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <h1>Formulario de contacto</h1>
    </header>
    <main class="main-carrito">
      <p class="parrafo-contacto">
        Para cualquier duda o comentario que tengas, dejanos tu mensaje:
      </p>
      <form action="https://formspree.io/f/mjyvbglk" method="POST">
        <div class="datos-formulario-contenedor">
          <label
            >Nombre:
            <input type="text" name="nombre" required />
          </label>
          <label
            >Apellido:
            <input type="text" name="apellido" required />
          </label>
          <label
            >Email:
            <input type="email" name="email" required />
          </label>
          <label
            >Mensaje:
            <textarea name="mensaje" rows="2" cols="1" required></textarea>
          </label>
        </div>
        <div class="boton-formulario-contenedor">
          <button class="boton-formulario" type="submit">Enviar</button>
        </div>
      </form>
    </main>
    <footer>
      <i class="fa-regular fa-copyright"></i> Copyright 2026 - Todos los
      derechos reservados
    </footer>
  </body>
</html>
