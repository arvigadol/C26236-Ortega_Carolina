all.min.css"

  <body>
    <header>
      <a href="../index.html">
        <img
          id="logo"
          src="../imagenes/logo.png"
          alt="Logo del sitio, imagen de carbohidratos"
      /></a>
      <nav>
        <ul class="nav-header">
          <li><a href="../index.html">Home</a></li>
          <li><a href="./carrito.html">Carrito</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <h1>Ponete en contacto con nosotrxs</h1>
    </header>
    <main class="main-contacto">
      <section>
        <h2 class="parrafo-contacto">
          Para cualquier duda o comentario que tengas, dejanos tu mensaje:
        </h2>
        <form action="https://formspree.io/f/mjyvbglk" method="POST">
          <div class="datos-formulario-contenedor">
            <label class="etiqueta-contacto"
              >Nombre:
              <input
                class="input-contacto"
                type="text"
                name="nombre"
                required
              />
            </label>
            <label class="etiqueta-contacto"
              >Apellido:
              <input
                class="input-contacto"
                type="text"
                name="apellido"
                required
              />
            </label>
            <label class="etiqueta-contacto"
              >Correo electrónico:
              <input
                class="input-contacto"
                type="email"
                name="correo"
                required
              />
            </label>
            <label class="etiqueta-contacto"
              >Mensaje:
              <textarea name="mensaje" rows="2" cols="1" required></textarea>
            </label>
          </div>
          <div class="boton-formulario-contenedor">
            <button class="boton-formulario" type="submit">Enviar</button>
          </div>
        </form>
      </section>
      <aside>
        <div class="aside-arriba">
          <h2 class="parrafo-contacto">O seguinos en nuestras redes:</h2>
          <nav>
            <ul class="nav-contacto">
              <li>
                <a href="https://www.instagram.com/musculosya/"
                  ><img
                    src="../imagenes/iconos/instagram.png"
                    alt="icono de instagram"
                    class="icono"
                  />
                  Instagram
                </a>
              </li>
              <li>
                <a href="https://www.facebook.com/musculosya.zonaoeste/"
                  ><img
                    src="../imagenes/iconos/facebook.png"
                    alt="icono de facebook"
                    class="icono"
                  />
                  Facebook
                </a>
              </li>
              <li>
                <a href="https://wa.me/1161865703"
                  ><img
                    src="../imagenes/iconos/whatsapp.png"
                    alt="icono de whatsapp"
                    class="icono"
                  />
                  Whatsapp
                </a>
              </li>
            </ul>
          </nav>
        </div>
        <div class="aside-abajo">
          <h2 class="parrafo-contacto">Encontranos aca:</h2>
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.0413905733244!2d-58.394436625653896!3d-34.6031148574639!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bccac1aa59bb85%3A0x7429dcd7f99bed7f!2sMUSCULOSYA!5e0!3m2!1ses-419!2sar!4v1790333582662!5m2!1ses-419!2sar"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
      </aside>
    </main>
    <footer>
      <i class="fa-regular fa-copyright"></i> Copyright 2026 - Todos los
      derechos reservados
    </footer>
  </body>
</html>
